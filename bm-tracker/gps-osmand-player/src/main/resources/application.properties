spring.application.name=gps-osmand-player
spring.main.banner-mode=off

# port for protocol osmand DCS
osmand.dcs=http://localhost:5055

# Camel Configuration
# keep the JVM running to poll the send directory during complete runtime
camel.main.run-controller=true
camel.springboot.main-run-controller=true

# GPX player input
# Gpx2OsmandLoader polls the send directory and creates a loaded player per GPX file.
# Empty send-directory = default 'send' directory next to the jar file.
# gps.player.send-directory=/path/to/send
gps.player.send-directory=
gps.player.loader-enabled=true
gps.player.include=.*\\.gpx
gps.player.poll-delay-ms=1000
gps.player.initial-delay-ms=0
gps.player.device-id=

# logging.pattern.console=%d{yy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
logging.pattern.console=%d{yy-MM-dd HH:mm:ss} %-5level %msg%n
# compact: %d{HH:mm:ss.SSS} %-5level %logger{30} - %msg%n 
# Without PID and app name: %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

logging.level.org.quartz = WARN
logging.level.org.apache.camel = WARN
# logging.level.bm.gps = DEBUG

logging.file.name=logs/gps-player.log
# Optional: Rolling policy settings
logging.logback.rollingpolicy.max-file-size=1MB
logging.logback.rollingpolicy.max-history=7





