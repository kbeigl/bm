spring.application.name=gps-tracker
spring.main.banner-mode=off

### logging configuration
# Override parent pom's logging.config for IDE JUnit runs
# logging.config=classpath:logback-test.xml

### gps tracker configuration

traccar.host=http://localhost:80

traccar.name=admin
traccar.password=admin
traccar.email=admin@scenario.com

traccar.web.serviceAccountToken=VIRTUAL_ADMIN_ACCESS

# port for tracker protocol osmand
# TODO -  USE DIFFERENT PORT THAN TRACCAR CLIENT PORT!
osmand.dcs=http://localhost:5055

# camel.main.run-controller=true

logging.pattern.console=[${spring.application.name}] %d{yy.MM.dd HH:mm:ss.SSSXXX} %-10level --- [%10.10t] %logger{0} : %msg%n

