spring.application.name=scotland-yard
spring.main.banner-mode=off
spring.output.ansi.enabled=never

# ------------------------------------------------------------------ traccar
# This file shadows the application.properties of traccar-realtime-service,
# therefore all properties required by the realtime stack must be set here.

# Traccar server (REST API), used for login and the api-client
traccar.host=http://localhost:80

# Traccar WebSocket address for realtime updates.
traccar.websocket=ws://localhost:80/api/socket

# Osmand Device Communication Server (DCS) the GPS trackers send positions to
osmand.dcs=http://localhost:5055

# remove for release, only for building and testing
traccar.web.serviceAccountToken=VIRTUAL_ADMIN_ACCESS

# realtime admin account running the scenario
traccar.name=admin
traccar.password=admin
traccar.email=admin@scenario.com

# traccar.name=sy-misterX-1794488580286
# traccar.password=scotland-yard
# traccar.email=sy-misterX-1794488580286@example.com

# ------------------------------------------------------------ scotland yard
# read by bm.sy.ScotlandYard (system properties with the same key take precedence)
# number of detectives chasing Mister X
scotland-yard.nrOfDetectives=2
# number of rounds (moves) before the game ends
scotland-yard.nrOfRounds=22
# duration of a round in milliseconds
scotland-yard.roundMillis=1000

# ------------------------------------------------------------------ logging
# logging.level.bm=DEBUG
