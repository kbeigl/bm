spring.main.banner-mode=off
spring.application.name=gpx-player

# Spring Configuration
# don't use ANSI colors in logs for easier copying
spring.output.ansi.enabled=never

# Camel Configuration
# keep the JVM running to poll for new GPX files
camel.springboot.main-run-controller=true

# ------------------------------------------------------------------
# GPX player values (see bm.gps.gpx.Gpx2OsmandLoader)
# ------------------------------------------------------------------

# directory polled for incoming GPX files;
# processed files are moved to parsed/, invalid files to error/
gps.player.send-directory=target/send

# Camel endpoint the parsed Osmand messages are sent to,
# e.g. seda:osmandMessages or http://localhost:5055
gps.player.output-uri=seda:osmandMessages

# regex filter for files picked up from the send directory
gps.player.include=.*\\.gpx

# file consumer polling interval and initial delay (milliseconds)
gps.player.poll-delay-ms=1000
gps.player.initial-delay-ms=0

# optional fixed device id set as message header (empty = none)
gps.player.device-id=

# logging levels
logging.level.org.springframework=INFO
logging.level.org.apache.camel.spring.boot=INFO
# logging.level.bm.gps=DEBUG
# logging.level.org.apache.camel=DEBUG
