name: Release

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - 'v*' # Triggers when pushing tags like v1.0, v2.1.3, etc.

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Find JAR files
        id: find_jars
        run: |
          OPENAPITOOLS=$(find bm-traccar/traccar-openapitools-client/target -name 'traccar-openapitools-client-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          API_CLIENT=$(find bm-traccar/traccar-api-client/target -name 'traccar-api-client-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          REALTIME=$(find bm-traccar/traccar-realtime-service/target -name 'traccar-realtime-service-*-exec.jar' | head -n 1)
          REALTIME_ORIG=$(find bm-traccar/traccar-realtime-service/target -name 'traccar-realtime-service-*.jar' ! -name '*-exec.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          GPX_PLAYER=$(find bm-tracker/gps-osmand-player/target -name 'gpx-player-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)

          test -n "$OPENAPITOOLS"
          test -n "$API_CLIENT"
          test -n "$REALTIME"
          test -n "$REALTIME_ORIG"
          test -n "$GPX_PLAYER"

          echo "openapitools_client=$OPENAPITOOLS" >> "$GITHUB_OUTPUT"
          echo "api_client=$API_CLIENT" >> "$GITHUB_OUTPUT"
          echo "realtime_client=$REALTIME" >> "$GITHUB_OUTPUT"
          echo "realtime_client_original=$REALTIME_ORIG" >> "$GITHUB_OUTPUT"
          echo "gpx_player=$GPX_PLAYER" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.find_jars.outputs.openapitools_client }}
            ${{ steps.find_jars.outputs.api_client }}
            ${{ steps.find_jars.outputs.realtime_client }}
            ${{ steps.find_jars.outputs.realtime_client_original }}
            ${{ steps.find_jars.outputs.gpx_player }}