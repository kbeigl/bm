name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (excluding integration tests and doc generation)
        run: |
          ./mvnw -B -ntp install \
            --file pom.xml \
            -Dintegration.tests.skip=true \
            -Ddocker.skip.tests=true \
            -Dopenapi.skip=false \
            -Dasciidoc.process.skip=true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bm-traccar/traccar-openapitools-client/target/*.jar
            bm-traccar/traccar-api-client/target/*.jar
            bm-traccar/traccar-realtime-service/target/*.jar
            bm-tracker/gps-osmand-player/target/*.jar
          if-no-files-found: ignore
